[project]
name = "python-package-template"
version = "0.1.0"
description = "A simple package using pydantic"
readme = "README.md"
requires-python = ">=3.10"  # Changed from >=3.8
license = {text = "MIT"}
authors = [
    {name = "AlexAndrewsAI", email = "alex.andrews.ai@protonmail.com"}
]
keywords = ["hello", "world"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",  # Added
]

dependencies = [
    "mypy>=1.14.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/yourusername/python-package-template"
Repository = "https://github.com/yourusername/python-package-template.git"
Documentation = "https://github.com/yourusername/python-package-template#readme"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
